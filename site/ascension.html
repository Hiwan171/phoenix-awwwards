<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Phoenix Ascension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --ink: #f3ede4; --gold: #ffb54a; --bg: #07070a; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #track { position: relative; width: 100%; height: 520vh; }
  #stage { position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden; background: var(--bg); }
  #mount { position: absolute; inset: 0; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; text-transform: uppercase; }
  header { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 30px 5.5vw; pointer-events: none; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 500; font-size: 11px; letter-spacing: .32em; }
  .brand i { width: 7px; height: 7px; border-radius: 50%; background: #ff681f; box-shadow: 0 0 12px #ff681f; }
  nav { display: flex; gap: 10px; font-size: 11px; letter-spacing: .24em; color: rgba(243,237,228,.82); }
  nav b { font-weight: 400; opacity: .55; }
  #copy { position: absolute; left: 5.5vw; top: clamp(104px, 16vh, 180px); width: min(560px, 42vw); z-index: 2; pointer-events: none; opacity: 0; transform: translateY(18px); transition: opacity 1.8s ease, transform 2.2s cubic-bezier(.2,.7,.1,1); }
  #copy.on { opacity: 1; transform: none; }
  #copy .kicker { margin: 0 0 26px; font-size: 11px; letter-spacing: .34em; color: #ffe2b4; display: flex; align-items: center; gap: 14px; text-shadow: 0 1px 14px rgba(0,0,0,.6); }
  #copy .kicker span { width: 34px; height: 1px; background: #ffe2b4; opacity: .8; }
  h1 { margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(58px, 7.6vw, 142px); line-height: .88; letter-spacing: -.025em; color: #f6f0e6; text-shadow: 0 2px 40px rgba(0,0,0,.45); }
  h1 em { font-style: italic; letter-spacing: -.01em; color: #ffd9a3; }
  #copy .sub { margin: 30px 0 0; max-width: 33ch; font-family: 'Geist', system-ui, sans-serif; font-weight: 300; font-size: clamp(15px, 1.12vw, 18px); line-height: 1.6; color: rgba(248,243,235,.92); text-shadow: 0 1px 18px rgba(0,0,0,.6); opacity: 0; transition: opacity 1.6s ease .4s; }
  #copy.on2 .sub { opacity: 1; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; padding: 0 5.5vw 34px; z-index: 2; pointer-events: none; }
  .hint { display: flex; align-items: center; gap: 16px; font-size: 10.5px; letter-spacing: .3em; color: rgba(243,237,228,.78); }
  .hint .line { position: relative; width: 1px; height: 46px; background: rgba(243,237,228,.18); overflow: hidden; }
  .hint .line::after { content: ''; position: absolute; inset: 0; background: var(--ink); animation: pa-scroll 2.6s cubic-bezier(.6,0,.3,1) infinite; }
  @keyframes pa-scroll { 0% { transform: scaleY(0); transform-origin: top } 45% { transform: scaleY(1); transform-origin: top } 55% { transform: scaleY(1); transform-origin: bottom } 100% { transform: scaleY(0); transform-origin: bottom } }
  .chapters { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; width: min(420px, 44vw); }
  .chapters .row { display: flex; gap: 18px; font-size: 10px; letter-spacing: .26em; }
  .chapters .row span { color: rgba(243,237,228,.42); transition: color .8s ease; }
  .chapters .row span.past { color: rgba(243,237,228,.75); }
  .chapters .row span.now { color: var(--gold); }
  .bar { position: relative; width: 100%; height: 1px; background: rgba(243,237,228,.18); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(255,181,74,.2), var(--gold)); }
  #loader { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--bg); transition: opacity 1.2s ease; }
  #loader .t { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(28px, 3vw, 44px); font-style: italic; letter-spacing: -.01em; }
  #loader .b { width: min(260px, 60vw); height: 1px; background: rgba(243,237,228,.14); position: relative; overflow: hidden; }
  #loader .b i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); transition: width .4s ease; }
  #loader .l { font-size: 10.5px; letter-spacing: .3em; color: rgba(243,237,228,.6); animation: pa-breathe 2.4s ease-in-out infinite; }
  @keyframes pa-breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  #err { position: absolute; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: var(--bg); padding: 40px; font-family: 'Geist', system-ui, sans-serif; }
  #hud { position: absolute; right: 12px; top: 64px; z-index: 4; font-family: 'Geist Mono', monospace; font-size: 10px; color: rgba(243,237,228,.6); white-space: pre; text-align: right; display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 720px) { #copy { width: 86vw; } .chapters { width: 60vw; } .chapters .row { gap: 8px; font-size: 8px; } }
</style>
</head>
<body>
<div id="track">
  <div id="stage">
    <div id="mount"></div>
    <header>
      <div class="brand mono"><i></i><span>Phoenix</span><span style="opacity:.45">/</span><span style="opacity:.8">Ascension</span></div>
      <nav class="mono"><b id="chi">Ch. 01</b><span id="chn">Dusk</span></nav>
    </header>
    <section id="copy">
      <p class="kicker mono"><span></span>A world reborn in fire</p>
      <h1>Phoenix<br><em>Ascension</em></h1>
      <p class="sub">Above an ocean of cloud, on the last summit of the world, a legend sleeps — and wakes to carry her fire into the night.</p>
    </section>
    <footer>
      <div class="hint mono"><span class="line"></span><span>Scroll to ascend</span></div>
      <div class="chapters mono"><div class="row" id="chrow"></div><div class="bar"><i id="prog"></i></div></div>
    </footer>
    <div id="hud"></div>
    <div id="loader"><div class="t">Phoenix Ascension</div><div class="b"><i id="lbar"></i></div><div class="l mono" id="ltxt">Preparing · 0%</div></div>
    <div id="err"><div style="max-width:460px"><div style="font-family:'Instrument Serif',serif;font-size:34px">The world could not be rendered.</div><p id="errt" style="font-weight:300;line-height:1.6;opacity:.75"></p></div></div>
  </div>
</div>
<script type="module" src="/src/ascension/main.js"></script>
</body>
</html>
