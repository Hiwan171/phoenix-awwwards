<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Opening lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070504'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FA4C14'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #120c10; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e9dfcf; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #spacer { height: 1000vh; }
  #hud { position: fixed; right: 12px; bottom: 10px; text-align: right; color: #cdbfae; white-space: pre; text-shadow: 0 1px 2px #000; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #cdbfae; text-shadow: 0 1px 2px #000; }
  #bar { position: fixed; left: 0; top: 0; height: 2px; background: #f2a43a; width: 0; }
  #panel { position: fixed; top: 10px; left: 10px; padding: 8px 10px; background: rgba(14, 12, 14, .78); border: 1px solid rgba(255, 220, 170, .18); border-radius: 8px; display: flex; gap: 6px; align-items: center; }
  #panel button, #panel select { background: #1d1a1d; color: #e9dfcf; border: 1px solid rgba(255, 220, 170, .22); border-radius: 5px; padding: 4px 8px; font: inherit; }
  #panel button.on { background: #3a2a1c; border-color: #8a5a2a; color: #ffd9a8; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="spacer"></div>
<div id="bar"></div>
<div id="panel"><button id="play">play (Space)</button><button id="restart">restart (R)</button><select id="dur"><option value="30">30 s</option><option value="45">45 s</option><option value="60" selected>60 s</option><option value="90">90 s</option><option value="120">120 s</option></select><label><input id="loop" type="checkbox"> loop</label></div>
<div id="hud"></div>
<div id="hint">auto-play at a constant rate (Space / R restart) or scroll by hand · C free camera (drag) · H hides the UI</div>
<script type="module" src="/src/opening-lab.js"></script>
</body>
</html>
