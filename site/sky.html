<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix · sky test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070504; overflow: hidden; font: 12px/1.4 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #eee7db; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #mist { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(90% 80% at 50% 45%, rgba(236, 232, 226, 0.96), rgba(196, 190, 186, 0.9) 70%, rgba(150, 144, 142, 0.9)); }
  #ui { position: fixed; left: 16px; top: 16px; width: 248px; display: flex; flex-direction: column; gap: 10px;
    padding: 12px; border-radius: 10px; background: rgba(7, 5, 4, 0.58); backdrop-filter: blur(8px); border: 1px solid #ffffff14; }
  #ui .row { display: flex; flex-direction: column; gap: 4px; }
  #ui .row > span { display: flex; justify-content: space-between; opacity: .72; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
  #ui button { padding: 6px 8px; border: 1px solid #ffffff22; border-radius: 6px; background: #14110f; color: inherit; cursor: pointer; text-align: left; font: inherit; }
  #ui button.on { background: #fa4c14; border-color: #fa4c14; color: #fff; }
  #presets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  #ui input[type=range] { width: 100%; accent-color: #fa4c14; }
  #ui label.chk { display: flex; gap: 8px; align-items: center; opacity: .85; cursor: pointer; }
  #hud { position: fixed; right: 16px; bottom: 14px; text-align: right; opacity: .8; line-height: 1.7; }
  #err { position: fixed; left: 16px; bottom: 14px; color: #ff6a4a; max-width: 60vw; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="mist"></div>

<div id="ui">
  <div class="row"><span>altitude <b id="vAlt">0 m</b></span><input type="range" id="alt" min="0" max="1" step="0.001" value="0.52"></div>
  <div id="presets">
    <button data-a="0">hero</button><button data-a="0.3">alvorada</button><button data-a="0.43">nuvens</button>
    <button data-a="0.5">nascer</button><button data-a="0.7">manhã</button><button data-a="1">dia</button>
  </div>
  <button id="auto">▶ subir (automático)</button>
  <div class="row"><span>cobertura <b id="vCover">0.58</b></span><input type="range" id="cover" min="0.3" max="0.85" step="0.01" value="0.58"></div>
  <div class="row"><span>vento <b id="vWind">9</b></span><input type="range" id="wind" min="0" max="40" step="1" value="9"></div>
  <div class="row"><span>azimute do sol <b id="vAz">0.14</b></span><input type="range" id="az" min="-0.7" max="0.7" step="0.01" value="0.14"></div>
  <div class="row"><span>fogo <b id="vFire">1.50</b></span><input type="range" id="fire" min="0" max="2" step="0.01" value="1.5"></div>
  <label class="chk"><input type="checkbox" id="c-stars" checked> estrelas</label>
  <label class="chk"><input type="checkbox" id="c-clouds" checked> nuvens (cúmulos)</label>
  <label class="chk"><input type="checkbox" id="c-cirrus" checked> cirros (altas)</label>
  <label class="chk"><input type="checkbox" id="c-fire" checked> fogo da fênix</label>
  <label class="chk"><input type="checkbox" id="c-bloom" checked> bloom</label>
  <div class="row"><span>qualidade do céu</span>
    <select id="quality"><option value="low">baixa</option><option value="mid">média</option><option value="high" selected>alta</option></select></div>
</div>
<div id="hud"><div id="hud-alt"></div><div id="hud-sun"></div><div id="hud-fps"></div></div>
<div id="err"></div>

<script type="module" src="/src/sky-test.js"></script>
</body>
</html>
