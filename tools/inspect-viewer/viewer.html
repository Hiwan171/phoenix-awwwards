<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2a2a2e;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2a2e);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); scene.add(key);
const rimL = new THREE.DirectionalLight(0xaabbff, 1.0); rimL.position.set(-3, 1, -3); scene.add(rimL);
const cam = new THREE.PerspectiveCamera(28, W / H, 0.01, 50);
const params = new URLSearchParams(location.search);
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(params.get('m') ?? '/model.glb');
scene.add(gltf.scene);
const mats = [];
gltf.scene.traverse((o) => { if (o.isMesh) { o.material.side = THREE.DoubleSide; mats.push([o.material, o.material.map, o.material.color.clone()]); } });
const box = new THREE.Box3().setFromObject(gltf.scene), ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
window.INFO = { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray() };
window.view = (az, el, clay = false, dist = 5.2, tx = 0, ty = 0) => {
  for (const [m, map, col] of mats) { m.map = clay ? null : map; m.color.copy(clay ? new THREE.Color(0xc9c9c9) : col); m.metalness = clay ? 0 : 1; m.roughness = clay ? 0.55 : 1; m.needsUpdate = true; }
  const a = az * Math.PI / 180, e = el * Math.PI / 180, r = dist * Math.max(size.x, size.y, size.z) / 1.9;
  cam.position.set(ctr.x + tx + r * Math.sin(a) * Math.cos(e), ctr.y + ty + r * Math.sin(e), ctr.z + r * Math.cos(a) * Math.cos(e));
  cam.lookAt(ctr.x + tx, ctr.y + ty, ctr.z); renderer.render(scene, cam);
};
// ---- orthographic view with a 0.1 grid (0.5 emphasised) for reading coordinates ----
const ocam = new THREE.OrthographicCamera(-1, 1, 1, -1, -20, 20);
const gridGroup = new THREE.Group(); scene.add(gridGroup); gridGroup.visible = false;
function addGrid(plane) { // plane 'xy' (front) or 'zy' (side)
  const pts = [], cols = [];
  const put = (a, b, c) => { pts.push(...a, ...b); cols.push(...c, ...c); };
  for (let k = -12; k <= 12; k++) {
    const t = k / 10, major = k % 5 === 0, c = k === 0 ? [1, 0.2, 0.2] : major ? [0.9, 0.9, 0.3] : [0.35, 0.35, 0.4];
    if (plane === 'xy') { put([t, -1.3, 0], [t, 1.3, 0], c); put([-1.3, t, 0], [1.3, t, 0], c); }
    else { put([0, -1.3, t], [0, 1.3, t], c); put([0, t, -1.3], [0, t, 1.3], c); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  gridGroup.clear(); gridGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false, transparent: true, opacity: 0.55 })));
}
// kind: 'front' (looking +Z from -Z; +X appears on screen-left... see note) | 'side'
window.ortho = (kind, cx = 0, cy = 0, half = 1.15, grid = true, clay = true) => {
  for (const [m, map, col] of mats) { m.map = clay ? null : map; m.color.copy(clay ? new THREE.Color(0xd0d0d6) : col); m.metalness = clay ? 0 : 1; m.roughness = clay ? 0.6 : 1; m.needsUpdate = true; }
  const asp = W / H; ocam.left = -half * asp + cx; ocam.right = half * asp + cx; ocam.top = half + cy; ocam.bottom = -half + cy; ocam.updateProjectionMatrix();
  addGrid(kind === 'front' ? 'xy' : 'zy'); gridGroup.visible = grid;
  if (kind === 'front') { ocam.position.set(cx, cy, -10); ocam.up.set(0, 1, 0); ocam.lookAt(cx, cy, 0); }
  else { ocam.position.set(10, cy, cx); ocam.up.set(0, 1, 0); ocam.lookAt(0, cy, cx); }
  renderer.render(scene, ocam);
};
const boneGroup = new THREE.Group(); scene.add(boneGroup);
const palette = {}; let pi = 0; const pcols = [0xff4040, 0x40ff60, 0x40a0ff, 0xffd040, 0xff40ff, 0x40ffff, 0xff8030, 0xa0ff30];
window.setBones = (joints) => {
  boneGroup.clear();
  const pts = [], cols = [], mk = [];
  for (const j of joints) {
    if (!(j.group in palette)) palette[j.group] = new THREE.Color(pcols[pi++ % pcols.length]);
    const c = palette[j.group];
    const par = joints.find((q) => q.name === j.parent);
    if (par) { pts.push(...par.pos, ...j.pos); cols.push(c.r, c.g, c.b, c.r, c.g, c.b); }
    pts.push(...j.pos, ...j.end); cols.push(c.r * 0.5, c.g * 0.5, c.b * 0.5, c.r * 0.5, c.g * 0.5, c.b * 0.5);   // dim = the bone's own capsule
    mk.push(...j.pos);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  boneGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false, transparent: true })));
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(mk, 3));
  boneGroup.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffffff, size: 7, sizeAttenuation: false, depthTest: false })));
  boneGroup.renderOrder = 999;
};
const mixer = new THREE.AnimationMixer(gltf.scene);
gltf.scene.traverse((o) => { if (o.isSkinnedMesh) o.frustumCulled = false; });
window.CLIPS = gltf.animations.map((c) => `${c.name}:${c.duration.toFixed(2)}`);
window.pose = (name, t) => {
  mixer.stopAllAction();
  const clip = gltf.animations.find((c) => c.name === name);
  if (clip) { const a = mixer.clipAction(clip); a.play(); mixer.setTime(t); } else { mixer.setTime(0); }
};
// ---- weight visualisation: vertex colour = weighted blend of the bone-group colours ----
const GROUP_COL = { body: [0.6, 0.6, 0.6], neck: [0.9, 0.9, 0.2], head: [1, 0.55, 0.1], crest: [1, 0.1, 0.8], wingL: [0.1, 0.7, 1], wingR: [0.2, 1, 0.3],
  tail: [1, 0.2, 0.2], leg: [0.5, 0.2, 1] };
const groupOf = (n) => /^Wing_L/.test(n) ? 'wingL' : /^Wing_R/.test(n) ? 'wingR' : /^Tail_/.test(n) ? 'tail' : /^Crest/.test(n) ? 'crest'
  : /^Leg_/.test(n) ? 'leg' : /^(Neck)/.test(n) ? 'neck' : /^(Head|Beak)/.test(n) ? 'head' : 'body';
let sm = null; gltf.scene.traverse((o) => { if (o.isSkinnedMesh) sm = o; });
let origMat = null;
window.weightMode = (on) => {
  if (!sm) return;
  if (!origMat) origMat = sm.material;
  if (!on) { sm.material = origMat; return; }
  const g = sm.geometry, si = g.attributes.skinIndex, sw = g.attributes.skinWeight, n = si.count;
  const names = sm.skeleton.bones.map((b) => groupOf(b.name));
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) for (let k = 0; k < 4; k++) {
    const c = GROUP_COL[names[si.getComponent(i, k)]], w = sw.getComponent(i, k);
    col[i * 3] += c[0] * w; col[i * 3 + 1] += c[1] * w; col[i * 3 + 2] += c[2] * w;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  sm.material = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
};
// small coloured spheres at given model-space points: window.marks([[x,y,z,'#ff0000',radius?], ...])
const markGroup = new THREE.Group(); scene.add(markGroup);
window.marks = (list) => {
  markGroup.clear();
  for (const [x, y, z, c = '#00ff66', r = 0.004] of list) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), new THREE.MeshBasicMaterial({ color: c, depthTest: false }));
    m.position.set(x, y, z); m.renderOrder = 1000; markGroup.add(m);
  }
};
// raycast a pixel of the CURRENT orbit view (call view() first) -> model-space point on the mesh, or null
window.pick = (px, py) => {
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((px / W) * 2 - 1, -(py / H) * 2 + 1), cam);
  const hits = rc.intersectObject(gltf.scene, true);
  return hits.length ? hits[0].point.toArray() : null;
};
window.READY = true;
</script></body></html>
